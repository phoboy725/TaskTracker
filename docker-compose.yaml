services:
  task-tracker-frontend:
    build:
      context: ./task-tracker-frontend
      dockerfile: Dockerfile
    image: task-tracker-frontend:latest
    ports:
      - "80:80"
    volumes:
      - ./task-tracker-frontend/nginx.conf:/etc/nginx/conf.d/default.conf
  postgres:
    image: "postgres:18.3-alpine"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    container_name: postgres
    environment:
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASS}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
volumes:
  postgres_data: